name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bind Remedy identity to clean HEAD
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=normal)"
          commit="$(git rev-parse --verify HEAD)"
          case "$commit" in
            ''|*[!0-9a-f]*) exit 1 ;;
          esac
          test "${#commit}" -eq 40
          printf 'SUIKO_REMEDY_COMMIT=%s\n' "$commit" >> "$GITHUB_ENV"
      - name: Install Rust 1.97
        run: rustup toolchain install 1.97 --profile minimal --component clippy,rustfmt
      - name: Cache SudachiDict
        uses: actions/cache@v4
        with:
          path: resources/system.dic
          key: sudachidict-20260723-core-53fa281d11eef376
      - name: Check formatting
        run: cargo +1.97 fmt --check
      - name: Run Clippy
        run: cargo +1.97 clippy --locked --all-targets --all-features -- -D warnings
      - name: Run tests from a clean target
        env:
          CARGO_TARGET_DIR: target/ci-clean
        run: cargo +1.97 test --locked --all-features --all-targets
