name: sudachi update check

on:
  schedule:
    # 毎週月曜 09:00 JST (00:00 UTC)
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check upstream sudachi.rs / crates.io / SudachiDict
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          ./scripts/check-sudachi-updates.sh > report.txt 2>&1
          echo "updates=$?" >> "$GITHUB_OUTPUT"
          cat report.txt
      - name: Open or update tracking issue
        if: steps.check.outputs.updates == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="sudachi関連の更新を検出"
          body="$(printf '週次チェックで更新を検出した。\n\n```\n%s\n```\n\n更新時はCHANGELOG、THIRD_PARTY_NOTICES、eval/calibration.mdの再測定を忘れない。' "$(cat report.txt)")"
          number="$(gh issue list --state open --search "in:title ${title}" --json number --jq '.[0].number // empty')"
          if [ -n "${number}" ]; then
            gh issue comment "${number}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}"
          fi
