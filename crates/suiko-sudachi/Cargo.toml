# WorksApplications/sudachi.rs v0.6.11 の非公式crates.io再配布。
# 上流が公式にcrates.ioへ公開した時点でそちらへ乗り換える。詳細はREADME.md。
[package]
name = "suiko-sudachi"
version = "0.6.11"
authors = ["Works Applications <sudachi@worksap.co.jp>"]
edition = "2021"
rust-version = "1.74.1"
description = "Unofficial crates.io redistribution of WorksApplications/sudachi.rs v0.6.11 (Japanese morphological analyzer) so that the suiko CLI can be installed from crates.io. Prefer the official crate once upstream publishes one."
readme = "README.md"
homepage = "https://github.com/WorksApplications/sudachi.rs"
repository = "https://github.com/nwiizo/suiko"
license = "Apache-2.0"
keywords = ["japanese", "morphological", "analyzer", "sudachi", "tokenizer"]
categories = ["text-processing"]
include = [
    "/src/**",
    "/resources/**",
    "/tests/resources/char.def",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
]

# 上流コードには手を加えないため、このcrateでは警告とclippyを無効にする。
[lints.rust]
warnings = "allow"

[lints.clippy]
all = { level = "allow", priority = -1 }

[dependencies]
aho-corasick = "1"
bitflags = "2.5"
csv = "1.3"
fancy-regex = "0.13"
indexmap = "2.2"
itertools = "0.13"
lazy_static = "1.4"
libloading = "0.8"
memmap2 = "0.9"
nom = "7"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
unicode-normalization = "0.1"
yada = "0.5"

[dev-dependencies]
claim = "0.5"
tempfile = "3"

[lib]
crate-type = ["rlib"]
