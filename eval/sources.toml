# 人間コーパスの取得元manifest。著作権のある本文はコミットせず、
# scripts/fetch-corpus.py が type=web の各URLをローカルの
# eval/corpus/external/ へ取得する(結果のSHA-256はexternal-lock.jsonに記録)。
# type=aozora はパブリックドメインのため eval/corpus/aozora/ にコミット済み。
#
# 出典: coji/natural-japanese (MIT) corpus/sources.json
#       @0f1cc1c5a4e2aa7590598c88a15c213a60d9545a を初期値として採用した。
#       slide genre 12件は除外した(SuikoのジャンルはEssay/Tech/Businessのみで、
#       スライドPDFはマスク後に散文がほぼ残らず、現時点で対応するジョブがない)。
#
# split: unit(webはドメイン、aozoraは著者)ごとに一括で割り当て、genreを
#        またいでも同一unitはsplitをまたがない。文書数の少ないunitから順に、
#        触れる全genreでholdoutが25%(切り上げ)+1を超えない場合だけholdoutへ
#        入れる。坂口安吾はcorpus.tomlのdev文書(darakuron)と同一著者のため
#        devに固定。

